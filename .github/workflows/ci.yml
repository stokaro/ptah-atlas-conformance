name: conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Health of the harness itself. This must always be green: it proves the probe
  # builds, the license boundary holds, and the committed report is up to date.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and boundary check
        run: make verify

      - name: Regenerate report
        run: make probe

      - name: Fail if the committed report is stale
        run: |
          if ! git diff --exit-code gaps.md gaps.json; then
            echo "gaps.md / gaps.json are out of date — run 'make probe' and commit the result."
            exit 1
          fi

  # The yardstick. Expected to stay RED until Ptah covers everything Atlas
  # expresses in the corpus. A red here means "not done yet", not "broken".
  conformance-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Conformance gate (red until parity)
        run: make gate
