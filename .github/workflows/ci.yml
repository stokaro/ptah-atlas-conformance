name: conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Health of the harness itself. This must always be green: it proves the probe
  # builds, the license boundary holds, and the committed report is up to date.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and boundary check
        run: make verify

      - name: Regenerate report
        run: make probe

      - name: Fail if the committed report is stale
        run: |
          if ! git diff --exit-code gaps.md gaps.json; then
            echo "gaps.md / gaps.json are out of date — run 'make probe' and commit the result."
            exit 1
          fi

  # The full-parity signal. This is expected to stay red until Ptah covers
  # everything Atlas expresses in the corpus.
  conformance-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Full Atlas conformance gate
        run: make gate

  # The CI gate. This stays green while the report is current and the unwaived
  # gap count does not regress above gap-budget.txt. Full parity remains
  # available locally via `make gate`.
  conformance-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Enforce gap budget
        run: make budget

      - name: Fail if the committed report is stale
        run: |
          if ! git diff --exit-code gaps.md gaps.json; then
            echo "gaps.md / gaps.json are out of date — run 'make probe' and commit the result."
            exit 1
          fi
