name: conformance-regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Health of the harness itself. This must always be green: it proves the probe
  # builds, the license boundary holds, and the committed report is up to date.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build and boundary check
        run: make verify

      - name: Regenerate report
        run: make probe

      - name: Fail if the committed report is stale
        run: |
          if ! git diff --exit-code gaps.md gaps.json; then
            echo "gaps.md / gaps.json are out of date -- run 'make probe' and commit the result."
            exit 1
          fi

  # The regression gate. This stays green while the report is current and the
  # unwaived gap count does not regress above gap-budget.txt. Full parity is a
  # separate workflow in full-conformance.yml.
  gap-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Enforce gap budget
        run: make budget

      - name: Fail if the committed report is stale
        run: |
          if ! git diff --exit-code gaps.md gaps.json; then
            echo "gaps.md / gaps.json are out of date -- run 'make probe' and commit the result."
            exit 1
          fi
